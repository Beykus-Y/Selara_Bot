services:
  postgres:
    image: postgres:16-alpine
    container_name: selara-postgres
    environment:
      POSTGRES_DB: ${SELARA_POSTGRES_DB:-selara}
      POSTGRES_USER: ${SELARA_POSTGRES_USER:-selara}
      POSTGRES_PASSWORD: ${SELARA_POSTGRES_PASSWORD:?Set SELARA_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SELARA_POSTGRES_USER:-selara} -d ${SELARA_POSTGRES_DB:-selara}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - selara_pg_data:/var/lib/postgresql/data
    networks:
      - selara_internal

  redis:
    image: redis:7-alpine
    container_name: selara-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - selara_redis_data:/data
    networks:
      - selara_internal

  app:
    # Hardening mirrors artifact-renderer (issue #55): non-root user, read-only
    # root fs, all capabilities dropped, no privilege escalation, resource
    # limits. Unlike the renderer, app keeps credentials (env_file), the
    # database/redis networks and published ports.
    # Writable paths on the read-only root fs:
    #   - /tmp (tmpfs, 1g): the daily backup writes a pg_dump and then all of
    #     its ~45 MB split parts, and never deletes the source dump, so the
    #     dump and the parts must fit simultaneously; also gacha reel ffmpeg
    #     output, Playwright Chromium profiles, matplotlib/fontconfig caches
    #     (MPLCONFIGDIR/XDG_CACHE_HOME) and XDG_CONFIG_HOME.
    #   - /data/gacha_reel_cache (named volume): generated gacha reel MP4s,
    #     regenerated automatically on demand. The image pre-creates the mount
    #     point owned by 10001, so fresh volumes inherit it (see
    #     INSTALLATION.md 4.4).
    # Limits are sized for the real peaks of this container, not the renderer:
    #   - mem_limit 4g: one gacha reel render peaks at ~1.2-1.4 GB
    #     (gacha_reel.py holds the accumulated PNG stdin payload, a second full
    #     copy from stdin_payload.getvalue() passed to ffmpeg, and the PIL
    #     frames), Chromium also runs in-process, and tmpfs pages are charged
    #     to this same cgroup. Exceeding the cap OOM-kills bot and web together,
    #     and restart: unless-stopped would turn that into a restart loop.
    #   - pids_limit 512: the limit counts threads, shared by Chromium, ffmpeg
    #     and the asyncio thread pool.
    #   - init: true: PID 1 below is `sh -c "alembic upgrade head && python -m
    #     selara.main"`, which does not reap orphaned Chromium/crashpad
    #     children; a real init process does.
    image: ${SELARA_IMAGE:-selara:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selara-app
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    tmpfs:
      - /tmp:rw,nosuid,size=1g,mode=1777
    env_file:
      - .env
    environment:
      DATABASE_URL: ${SELARA_DATABASE_URL:?Set SELARA_DATABASE_URL}
      REDIS_URL: ${SELARA_REDIS_URL:-redis://redis:6379/0}
      GACHA_REEL_CACHE_DIR: /data/gacha_reel_cache
      ARTIFACT_RENDERER_URL: http://artifact-renderer:8090
      XDG_CONFIG_HOME: /tmp/config
    volumes:
      - selara_gacha_reel_cache:/data/gacha_reel_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      artifact-renderer:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    networks:
      - selara_internal
      - artifact_rendering
      - edge

  artifact-renderer:
    image: ${SELARA_IMAGE:-selara:local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "selara.infrastructure.llm.artifact_worker"]
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,size=128m,mode=1777
    environment:
      XDG_CACHE_HOME: /tmp/cache
      XDG_CONFIG_HOME: /tmp/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - artifact_rendering

  # Optional self-hosted metasearch for the ?/?? web tools. Not started by the
  # deploy workflow and not required by app: start it with
  #   docker compose up -d searxng
  # (needs SELARA_SEARXNG_SECRET). No published port: reachable only as
  # http://searxng:8080 from the compose network. Without it the bot falls back
  # to DuckDuckGo.
  searxng:
    image: ${SELARA_SEARXNG_IMAGE:-searxng/searxng:latest}
    container_name: selara-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SELARA_SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    networks:
      - selara_internal

  web:
    image: ${SELARA_WEB_IMAGE:-selara-web:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_BASE_PATH: ${SELARA_WEB_BASE_PATH:-/miniapp/}
    container_name: selara-web
    restart: unless-stopped
    depends_on:
      - app
    environment:
      LISTEN_PORT: "8081"
      APP_UPSTREAM: "app:${WEB_PORT:-8080}"
      GACHA_BASE_URL: "${GACHA_BASE_URL:-http://selara-gacha:8001}"
    expose:
      - "8081"
    networks:
      - edge

volumes:
  selara_pg_data:
  selara_redis_data:
  # Only the regenerable gacha reel cache pins an explicit name, following
  # gacha/docker-compose.yml. It is safe to replace and the stable name keeps
  # INSTALLATION.md 4.4 accurate. Do NOT pin selara_pg_data or
  # selara_redis_data: a pinned name would be a different volume from the
  # project-prefixed one a running deployment already uses, orphaning the
  # production Postgres/Redis data.
  selara_gacha_reel_cache:
    name: selara_gacha_reel_cache

networks:
  artifact_rendering:
    internal: true
  selara_internal:
  edge:
    external: true
