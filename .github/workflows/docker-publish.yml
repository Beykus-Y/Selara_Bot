name: Publish Docker Image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify CI commit is current main
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "short_sha=${CI_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$CI_SHA" >> "$GITHUB_OUTPUT"

          existing_manifest="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "release-manifest" and .expired == false) | .id')"
          if [[ -n "$existing_manifest" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Reusing immutable release $GITHUB_RUN_ID (artifact $existing_manifest); not rebuilding images" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "No retained manifest for this rerun; start a new publisher run instead of changing a release identity" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ -z "$current_main_sha" ]]; then
            echo "Could not read the current main SHA" >&2
            exit 1
          fi

          if [[ "$CI_SHA" == "$current_main_sha" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI run for $CI_SHA; current main is $current_main_sha"
          fi

      - name: Set up Docker Buildx
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app Docker metadata
        if: steps.freshness.outputs.publish == 'true'
        id: meta_app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ secrets.GHCR_USERNAME }}/selara
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.freshness.outputs.short_sha }}
            type=raw,value=sha-${{ steps.freshness.outputs.commit_sha }}

      - name: Build and push app image
        id: build_app
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: |
            ${{ steps.meta_app.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.freshness.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract web Docker metadata
        if: steps.freshness.outputs.publish == 'true'
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ secrets.GHCR_USERNAME }}/selara-web
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.freshness.outputs.short_sha }}
            type=raw,value=sha-${{ steps.freshness.outputs.commit_sha }}

      - name: Build and push web image
        id: build_web
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_APP_BASE_PATH=/miniapp/
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: |
            ${{ steps.meta_web.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.freshness.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract gacha Docker metadata
        if: steps.freshness.outputs.publish == 'true'
        id: meta_gacha
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ secrets.GHCR_USERNAME }}/selara-gacha
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.freshness.outputs.short_sha }}
            type=raw,value=sha-${{ steps.freshness.outputs.commit_sha }}

      - name: Build and push gacha image
        id: build_gacha
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./gacha/Dockerfile
          push: true
          tags: ${{ steps.meta_gacha.outputs.tags }}
          labels: |
            ${{ steps.meta_gacha.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.freshness.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save complete release digest manifest
        if: steps.freshness.outputs.publish == 'true'
        env:
          RELEASE_COMMIT: ${{ steps.freshness.outputs.commit_sha }}
          IMAGE_OWNER: ${{ secrets.GHCR_USERNAME }}
          APP_DIGEST: ${{ steps.build_app.outputs.digest }}
          WEB_DIGEST: ${{ steps.build_web.outputs.digest }}
          GACHA_DIGEST: ${{ steps.build_gacha.outputs.digest }}
        run: python3 scripts/release_manifest.py build release/manifest.json

      - name: Upload immutable release manifest
        if: steps.freshness.outputs.publish == 'true'
        id: release
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release/manifest.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Report release identity
        if: steps.freshness.outputs.publish == 'true'
        env:
          ARTIFACT_ID: ${{ steps.release.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.release.outputs.artifact-digest }}
          RELEASE_COMMIT: ${{ steps.freshness.outputs.commit_sha }}
        run: |
          {
            echo "Release input (publisher run ID): $GITHUB_RUN_ID"
            echo "Commit: $RELEASE_COMMIT"
            echo "Immutable artifact: $ARTIFACT_ID ($ARTIFACT_DIGEST)"
            cat release/manifest.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
