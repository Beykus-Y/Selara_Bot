name: Publish Docker Image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify CI commit is current main
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ -z "$current_main_sha" ]]; then
            echo "Could not read the current main SHA" >&2
            exit 1
          fi

          if [[ "$CI_SHA" == "$current_main_sha" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI run for $CI_SHA; current main is $current_main_sha"
          fi

      - name: Set up Docker Buildx
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app Docker metadata
        if: steps.freshness.outputs.publish == 'true'
        id: meta_app
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ghcr.io/${{ secrets.GHCR_USERNAME }}/selara
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push app image
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract web Docker metadata
        if: steps.freshness.outputs.publish == 'true'
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ghcr.io/${{ secrets.GHCR_USERNAME }}/selara-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push web image
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_APP_BASE_PATH=/miniapp/
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract gacha Docker metadata
        if: steps.freshness.outputs.publish == 'true'
        id: meta_gacha
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ghcr.io/${{ secrets.GHCR_USERNAME }}/selara-gacha
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push gacha image
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./gacha/Dockerfile
          push: true
          tags: ${{ steps.meta_gacha.outputs.tags }}
          labels: ${{ steps.meta_gacha.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
