name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selara_test
          POSTGRES_USER: selara_test
          POSTGRES_PASSWORD: selara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selara_test -d selara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC
      BOT_TOKEN: 123456:CI_TOKEN
      DATABASE_URL: postgresql+asyncpg://selara_test:selara_test@127.0.0.1:5432/selara_test
      TEST_DATABASE_URL: postgresql+asyncpg://selara_test:selara_test@127.0.0.1:5432/selara_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      GACHA_DATABASE_URL: postgresql+asyncpg://selara_test:selara_test@127.0.0.1:5432/selara_gacha_test
      TEST_GACHA_DATABASE_URL: postgresql+asyncpg://selara_test:selara_test@127.0.0.1:5432/selara_gacha_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up locked Python resolver
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Check Python lock matches manifests
        run: uv lock --check

      - name: Install locked Python dependencies
        run: |
          uv sync --locked --all-packages --all-extras --group build --group audit --no-install-workspace --no-build
          uv sync --locked --all-packages --all-extras --group build --group audit --no-build-isolation
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Audit Python dependencies
        run: pip-audit --progress-spinner off

      - name: Verify installed CI graph matches lock
        run: python scripts/check_locked_python_runtime.py uv.lock selara

      - name: Install snapshot fonts
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji ffmpeg

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Create gacha test database
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U selara_test -d selara_test
          -c "CREATE DATABASE selara_gacha_test"

      - name: Apply main migrations
        run: python -m alembic upgrade head

      - name: Apply gacha migrations
        working-directory: gacha
        run: python -m alembic upgrade head

      - name: Verify hardened gacha container runtime
        run: |
          docker build -f gacha/Dockerfile -t selara-gacha:ci .
          docker run --rm --read-only --tmpfs /tmp --entrypoint python \
            -v "$PWD/scripts:/checks:ro" selara-gacha:ci \
            /checks/check_locked_python_runtime.py /app/uv.lock selara-gacha
          docker run --rm --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 1g --cpus 1 --pids-limit 256 \
            --tmpfs /tmp:rw,noexec,nosuid,size=536870912,mode=1777 \
            -e GACHA_DATABASE_URL -e GACHA_APP_DIR=/app \
            -v /data \
            -v "$PWD/scripts:/checks:ro" --entrypoint sh selara-gacha:ci \
            -ec 'alembic upgrade head && python /checks/check_gacha_container_runtime.py'

      - name: Verify locked production app image
        run: |
          docker build -f Dockerfile -t selara:ci .
          docker run --rm --read-only --tmpfs /tmp --entrypoint python \
            -v "$PWD/scripts:/checks:ro" selara:ci \
            /checks/check_locked_python_runtime.py /app/uv.lock selara

      - name: Compile Python sources
        run: python -m compileall -q src gacha/src

      - name: Run main unit tests
        run: python -m pytest -q tests/unit

      - name: Run main integration tests
        run: python -m pytest -q tests/integration

      - name: Run gacha tests
        working-directory: gacha
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production frontend dependencies (high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Python for Mini App browser regression
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up locked Python resolver for browser tooling
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install locked Playwright and Jinja2 browser tooling
        working-directory: .
        run: |
          uv sync --locked --only-group browser --no-build
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install browser from locked Playwright version
        run: |
          python -m playwright install --with-deps chromium

      - name: Lint frontend
        env:
          SELARA_PYTHON: python
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test Mini App broadcast selection in mobile browser
        run: python ../scripts/test_miniapp_admin_broadcast_browser.py

      - name: Test Mini App Selara AI panel and admin analytics in mobile browser
        run: python ../scripts/test_miniapp_selara_ai_browser.py

      - name: Test Mini App personal page (subscription, memory, privacy) in mobile browser
        run: python ../scripts/test_miniapp_personal_browser.py

      - name: Test Mini App model configuration in mobile browser
        run: python ../scripts/test_miniapp_admin_models_browser.py
