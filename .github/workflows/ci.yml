name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selara_test
          POSTGRES_USER: selara_test
          POSTGRES_PASSWORD: selara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selara_test -d selara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: 123456:CI_TOKEN
      DATABASE_URL: postgresql+asyncpg://selara_test:selara_test@127.0.0.1:5432/selara_test
      TEST_DATABASE_URL: postgresql+asyncpg://selara_test:selara_test@127.0.0.1:5432/selara_test
      GACHA_DATABASE_URL: postgresql+asyncpg://selara_test:selara_test@127.0.0.1:5432/selara_gacha_test
      TEST_GACHA_DATABASE_URL: postgresql+asyncpg://selara_test:selara_test@127.0.0.1:5432/selara_gacha_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]" -e "./gacha[dev]" pip-audit

      - name: Audit Python dependencies
        run: pip-audit --progress-spinner off

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Create gacha test database
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U selara_test -d selara_test
          -c "CREATE DATABASE selara_gacha_test"

      - name: Apply main migrations
        run: python -m alembic upgrade head

      - name: Apply gacha migrations
        working-directory: gacha
        run: python -m alembic upgrade head

      - name: Compile Python sources
        run: python -m compileall -q src gacha/src

      - name: Run main unit tests
        run: python -m pytest -q tests/unit

      - name: Run main integration tests
        run: python -m pytest -q tests/integration

      - name: Run gacha tests
        working-directory: gacha
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
