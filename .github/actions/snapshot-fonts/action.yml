name: Snapshot fonts and ffmpeg
description: >-
  Installs the fonts and ffmpeg that the snapshot tests need. The downloaded
  .deb files are cached, every apt call has a hard timeout, and the last
  attempt falls back to the public Ubuntu mirror.

runs:
  using: composite
  steps:
    - name: Restore cached font packages
      id: debs-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/snapshot-debs
        key: snapshot-debs-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('.github/actions/snapshot-fonts/action.yml') }}

    - name: Install fonts and ffmpeg
      shell: bash
      env:
        CACHE_HIT: ${{ steps.debs-cache.outputs.cache-hit }}
      run: |
        set -u
        PKGS="fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji ffmpeg"
        DEBS="$HOME/snapshot-debs"
        APT_OPTS="-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"

        if [ "$CACHE_HIT" = "true" ] && ls "$DEBS"/*.deb >/dev/null 2>&1; then
          echo "Installing from cached packages"
          if timeout 180 sudo dpkg -i "$DEBS"/*.deb; then
            exit 0
          fi
          echo "Cached packages did not install, falling back to apt" >&2
        fi

        mkdir -p "$DEBS"
        for attempt in 1 2 3; do
          if [ "$attempt" = "3" ]; then
            echo "Switching to archive.ubuntu.com for the last attempt"
            sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          fi
          # Each call is bounded so a stalled mirror fails the attempt in ~3 minutes.
          if timeout 60 sudo apt-get $APT_OPTS update \
            && timeout 120 sudo apt-get $APT_OPTS install -y --no-install-recommends \
                 -o Dir::Cache::archives="$DEBS" $PKGS; then
            sudo chown -R "$(id -u):$(id -g)" "$DEBS"
            rm -rf "$DEBS/partial" "$DEBS/lock"
            exit 0
          fi
          echo "apt attempt $attempt failed" >&2
          sleep 5
        done
        exit 1
      timeout-minutes: 10

    - name: Save font packages to cache
      if: ${{ steps.debs-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ~/snapshot-debs
        key: snapshot-debs-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('.github/actions/snapshot-fonts/action.yml') }}
