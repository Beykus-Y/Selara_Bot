{% macro breadcrumb(items) -%}
<nav class="breadcrumb" aria-label="Хлебные крошки">
  {%- for item in items %}
  {%- if not loop.first %}<span class="breadcrumb-sep" aria-hidden="true">/</span>{% endif %}
  {%- if item.href|default(none) %}<a href="{{ item.href }}">{{ item.label }}</a>{% else %}<span>{{ item.label }}</span>{% endif -%}
  {% endfor %}
</nav>
{%- endmacro %}

{% macro status_badge(base_class, tone, label) -%}
<span class="{{ base_class }} {{ base_class }}-{{ tone }}">{{ label }}</span>
{%- endmacro %}
