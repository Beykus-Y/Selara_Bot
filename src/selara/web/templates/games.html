{% extends "base.html" %}

{% block content %}
  <section class="hero hero-party">
    <div class="hero-copy">
      <span class="eyebrow">Selara Party</span>
      <h1>{{ hero_title }}</h1>
      <p class="lead">{{ hero_subtitle }}</p>
      <div class="hero-cta-row">
        <a class="button primary" href="#create-game">Создать игру</a>
        <a class="button ghost" href="#games-list">К партиям</a>
      </div>
    </div>
    <div class="hero-side">
      <div class="hero-chip">блеф и дедукция</div>
      <div class="hero-chip">живые партии</div>
      <div class="hero-chip">Telegram и браузер</div>
      <button type="button" class="hero-chip live-chip" data-live-indicator data-manual-refresh data-state="ready">обновить сцену</button>
    </div>
  </section>

  <section id="games-live-root" data-live-root data-live-signature="{{ live_signature }}">
    {% include "_games_dashboard.html" %}
  </section>
{% endblock %}
